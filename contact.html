<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1day講座申し込みフォーム | DESIGN CAMPUS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="logo" href="index.html">
          <img src="assets/images/logo.png" width="176" height="36" alt="DESIGN CAMPUS" />
        </a>
        <button class="menu-toggle" type="button" aria-label="メニュー" aria-expanded="false">
          <span></span>
        </button>
        <nav class="site-nav" aria-label="サイトナビ">
          <a href="index.html#features">本講座の特徴</a>
          <a href="index.html#courses">講座一覧</a>
          <a href="index.html#faq">よくあるご質問</a>
        </nav>
        <a class="btn header-cta" href="contact.html">お申し込みはこちら</a>
      </div>
    </header>

    <main class="page-main contact-page">
      <h1>1day講座申し込みフォーム</h1>
      <form class="contact-form" id="contact-form" action="thanks.html" method="get" novalidate>
        <div class="form-field">
          <label class="form-label" for="name">
            名前
            <span class="required">必須</span>
          </label>
          <input id="name" name="name" type="text" placeholder="お名前を入力してください。" required />
          <p class="form-error" data-error-for="name"></p>
        </div>
        <div class="form-field">
          <label class="form-label" for="email">
            メールアドレス
            <span class="required">必須</span>
          </label>
          <input id="email" name="email" type="email" placeholder="メールアドレスを入力してください。" required />
          <p class="form-error" data-error-for="email"></p>
        </div>
        <div class="form-field">
          <label class="form-label" for="tel">電話番号</label>
          <input id="tel" name="tel" type="tel" placeholder="電話番号を入力してください。" />
        </div>
        <fieldset class="form-field">
          <legend class="form-label">
            参加希望
            <span class="required">必須</span>
          </legend>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="course" value="12-10" required />
              <span class="radio-option__text">
                <span>12/10(日)</span>
                <span>2時間でかんたんに名刺デザインを作成してみよう！</span>
              </span>
            </label>
            <label class="radio-option">
              <input type="radio" name="course" value="12-17" />
              <span class="radio-option__text">
                <span>12/17(日)</span>
                <span>集客のためのWeb活用術〜SEOとユーザビリティのお話〜</span>
              </span>
            </label>
          </div>
          <p class="form-error" data-error-for="course"></p>
        </fieldset>
        <div class="form-actions">
          <label class="agree">
            <input type="checkbox" name="privacy" id="privacy" required />
            プライバシーポリシーに同意する
          </label>
          <p class="form-error" data-error-for="privacy"></p>
          <button class="btn btn--submit" type="submit">送 信</button>
        </div>
      </form>
    </main>

    <footer class="site-footer">
      <p>Copyright 2023 DESIGN CAMPUS</p>
    </footer>
    <script src="js/main.js"></script>
  </body>
</html>
